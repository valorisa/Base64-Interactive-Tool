name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package
        run: |
          python -m pip install -e .[dev]

      - name: Verify package builds
        run: |
          python -m build

      - name: Compile Python sources
        run: |
          python -m compileall -q base64_tool

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run test suite
        run: |
          pytest

      - name: Measure test coverage
        run: |
          pytest --cov=base64_tool --cov-report=term-missing
