[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "base64-interactive-tool"
version = "2.0.0"
description = "A small, elegant and maintainable Base64 encoder/decoder."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "valorisa" }
]
keywords = [
    "base64",
    "cli",
    "encoding",
    "decoder",
    "encoder",
    "interactive",
    "python",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.12 ; platform_system != 'Android'",
]

[project.urls]
Homepage = "https://github.com/valorisa/base64-tool"
Repository = "https://github.com/valorisa/base64-tool"
Issues = "https://github.com/valorisa/base64-tool/issues"

[project.scripts]
base64-tool = "base64_tool.cli:main"

[tool.setuptools]
packages = ["base64_tool"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = [
    "base64_tool",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
